name: Build Diet Tracker appearance update
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/build-diet-tracker-appearance-update.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-35 build-tools;35.0.0
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: calorie-counter-debug-signing-v1
    - name: Apply working Diet Tracker updates
      run: |
        python3 -m pip install --quiet PyYAML Pillow
        python3 - <<'PY'
        from pathlib import Path
        import yaml,subprocess
        w=yaml.safe_load(Path('.github/workflows/build-diet-tracker-update.yml').read_text())
        steps=w['jobs']['update']['steps']
        for name in ['Apply working unit and focus updates','Apply Diet Tracker navigation and checkbox updates']:
         step=next(s for s in steps if s.get('name')==name)
         subprocess.run(['bash','-e','-c',step['run']],check=True)
        PY
    - name: Apply icon-only navigation and appearance update
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import re,colorsys
        from PIL import Image
        root=Path('CalorieCounter');pkg=root/'app/src/main/java/com/example/caloriecounter'
        def change(s,old,new):
         if s.count(old)!=1:raise SystemExit('Appearance patch source mismatch: '+repr(old))
         return s.replace(old,new)
        p=pkg/'MainActivity.kt';s=p.read_text()
        s=change(s,',label={Text(tab)}',',alwaysShowLabel=false')
        p.write_text(s)
        # Only page headings change; section and card headings keep their hierarchy.
        for filename,title in [('FavouritesScreen.kt','Favourites'),('FoodScreens.kt','Find food'),('RestaurantScreen.kt','Restaurants')]:
         p=pkg/filename;s=p.read_text()
         s=change(s,'Text("'+title+'",style=MaterialTheme.typography.headlineSmall)','Text("'+title+'",style=MaterialTheme.typography.headlineMedium)')
         p.write_text(s)
        # Home/History, Recipes and Settings already use headlineMedium.
        p=root/'app/src/main/res/values/icon_colors.xml';s=p.read_text()
        s,n=re.subn(r'(<color name="launcher_background">)[^<]+(</color>)',r'\g<1>#6750A4\g<2>',s)
        if n!=1:raise SystemExit('Launcher background colour missing')
        p.write_text(s)
        p=root/'app/src/main/res/drawable-nodpi/launcher_foreground.png'
        im=Image.open(p).convert('RGBA');out=[]
        for r,g,b,a in im.getdata():
         h,s,v=colorsys.rgb_to_hsv(r/255,g/255,b/255)
         if a and s>0.12:
          rr,gg,bb=colorsys.hsv_to_rgb(270/360,s*0.8,v)
          out.append((round(rr*255),round(gg*255),round(bb*255),a))
         else:out.append((r,g,b,a))
        im.putdata(out);im.save(p)
        p=root/'app/build.gradle.kts';s=p.read_text();m=re.search(r'versionCode\s*=\s*(\d+)',s);v=max(34,int(m.group(1))+1)
        s=re.sub(r'versionCode\s*=\s*\d+','versionCode = '+str(v),s)
        s=re.sub(r'versionName\s*=\s*"[^"]+"','versionName = "3.3-appearance"',s);p.write_text(s)

        PY
    - name: Test and build
      run: gradle -p CalorieCounter testDebugUnitTest assembleDebug --console=plain
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: diet-tracker-3.3-appearance-apk
        path: CalorieCounter/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
    - name: Upload source and test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: diet-tracker-appearance-source-and-reports
        path: |-
          CalorieCounter/app/src/main
          CalorieCounter/app/build/reports/tests
        if-no-files-found: warn
