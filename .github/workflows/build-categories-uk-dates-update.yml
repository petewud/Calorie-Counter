ateOf(initial.activity)};var uk by remember{mutableStateOf(initial.ukFirst)};var estimate by remember{mutableStateOf(onboarding)}\\n var auto by remember{mutableStateOf(initial.autoCalorieTarget)};var eligible by remember{mutableStateOf(initial.autoGoalEligible)}\\n val targets=remember{mutableStateListOf<String>().apply{addAll(initial.targets.map{it.toString()})}};var message by remember{mutableStateOf(\\"\\")}\\n val a=age.toIntOrNull();val h=height.toDoubleOrNull();val w=weightInputToKg(weight,unit);val goal=weightInputToKg(targetWeight,unit)\\n val valid=sex in listOf(\\"Female\\",\\"Male\\")&&a!=null&&a in 18..120&&h!=null&&h.isFinite()&&h in 100.0..250.0&&w!=null&&w.isFinite()&&w in 25.0..400.0\\n val goalValid=if(targetWeight.isBlank())!onboarding else goal!=null&&goal.isFinite()&&goal in 25.0..400.0\\n val kcal=if(valid)estimateCalories(sex,a!!,h!!,w!!,activity)else null\\n val numbers=targets.mapIndexed{i,t->if(i==0&&auto)initial.targets[0]else if(i==0&&estimate)kcal else t.toDoubleOrNull()}\\n val numbersValid=numbers.all{it!=null&&it.isFinite()&&it>0}\\n val candidate=Profile(true,sex,a?:30,h?:170.0,w?:70.0,activity,numbers.map{it?:2000.0},uk,goal,goalDate,auto,eligible)\\n val plan=calorieGoalEstimate(candidate)\\n val export=rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument(\\"application/json\\")){uri->if(uri!=null)runCatching{context.contentResolver.openOutputStream(uri)?.bufferedWriter()?.use{it.write(store.exportBackup())}?:error(\\"Cannot open backup\\")}.onSuccess{message=\\"Backup saved.\\"}.onFailure{message=\\"Backup failed: ${it.message}\\"}}\\n val importer=rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()){uri->if(uri!=null)runCatching{val raw=context.contentResolver.openInputStream(uri)?.bufferedReader()?.use{it.readText()}?:error(\\"Cannot read backup\\");store.importBackup(raw)}.onSuccess{onSave(store.profile())}.onFailure{message=\\"Import failed: ${it.message}\\"}}\\n if(goalCalendarOpen)App