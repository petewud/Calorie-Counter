    - name: Test and build APK
      run: gradle -p CalorieCounter testDebugUnitTest assembleDebug --console=plain
    - name: Package complete updated source
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import zipfile,json
        root=Path('CalorieCounter')
        with zipfile.ZipFile('CalorieCounter-updated.zip','w',zipfile.ZIP_DEFLATED) as archive:
         for p in sorted(root.rglob('*')):
          if p.is_file() and not any(part in {'build','.gradle','.git'} for part in p.parts) and p.name!='local.properties':archive.write(p,p.as_posix())
        with zipfile.ZipFile('CalorieCounter-updated.zip') as archive:assert archive.testzip() is None
        Path('categories-uk-dates-report.json').write_text(json.dumps({'version':'4.0-categories-uk-dates','category_model':'Separate recipes and favourites collections; one category per item','legacy_backup':'Uncategorised on a fresh restore','restore':'Recipe IDs and recipe-linked favourite IDs remapped','dates':'dd-MM-yyyy display; ISO storage unchanged','tests_added':14},indent=2))
        PY
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: diet-tracker-4.0-categories-uk-dates-apk
        path: CalorieCounter/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
    - name: Upload complete updated project
      uses: actions/upload-artifact@v4
      with:
        name: diet-tracker-4.0-source-project
        path: |-
          CalorieCounter-updated.zip
          categories-uk-dates-report.json
        if-no-files-found: error
    - name: Upload source and test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: categories-uk-dates-source-and-reports
        path: |-
          CalorieCounter/app/src/main
          CalorieCounter/app/src/test
          CalorieCounter/app/build/reports/tests
        if-no-files-found: warn
