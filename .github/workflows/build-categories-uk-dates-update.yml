name: Build categories and UK dates update
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/build-categories-uk-dates-update.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-35 build-tools;35.0.0
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: calorie-counter-debug-signing-v1
    - name: Prepare the verified current app
      run: |
        python3 -m pip install --quiet PyYAML Pillow
        python3 - <<'PY'
        from pathlib import Path
        import yaml,subprocess
        w=yaml.safe_load(Path('.github/workflows/build-sorting-search-scanner-update.yml').read_text())
        for name in ['Apply previous working updates','Apply sorting search and scanner update']:
         step=next(s for s in w['jobs']['update']['steps'] if s.get('name')==name)
         subprocess.run(['bash','-e','-c',step['run']],check=True)
        PY
    - name: Apply categories and UK dates
      run: |
        python3 - <<'PY'
