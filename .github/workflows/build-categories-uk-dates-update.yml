rawLine(goalColor,project(first,points.first().kg,size),project(goalDay,goalWeight,size),2.dp.toPx())\\n     trend?.let{f->drawLine(forecastColor,project(f.startDay,f.startKg,size),project(f.endDay,f.value(f.endDay),size),2.dp.toPx(),pathEffect=androidx.compose.ui.graphics.PathEffect.dashPathEffect(floatArrayOf(12f,8f)))}\\n     points.zipWithNext().forEach{(a,bp)->drawLine(colors.primary,point(a,size),point(bp,size),2.dp.toPx())}\\n     points.forEach{r->val p=point(r,size);drawCircle(colors.primary,5.dp.toPx(),p);drawCircle(colors.surface,2.dp.toPx(),p)}\\n    }\\n    val formatter=DateTimeFormatter.ofPattern(\\"dd-MM-uuuu\\")\\n    fun dateAt(x:Float):String{\\n     val normalized=.5+((x-b.center.x-pan.x)/(b.width*zoom)).toDouble()\\n     return LocalDate.ofEpochDay((minX+normalized*(maxX-minX)).toLong()).format(formatter)\\n    }\\n    val baseline=size.height-outer-metrics.descent\\n    paint.textAlign=Paint.Align.LEFT;drawContext.canvas.nativeCanvas.drawText(dateAt(b.left),b.left,baseline,paint)\\n    paint.textAlign=Paint.Align.RIGHT;drawContext.canvas.nativeCanvas.drawText(dateAt(b.right),b.right,baseline,paint)\\n   }\\n  }\\n  if(goalDay!=null)Text(\\"Green: goal\\",color=goalColor,style=MaterialTheme.typography.bodySmall)\\n  if(trend!=null)Text(\\"Orange dashed: estimated trend\\",color=forecastColor,style=MaterialTheme.typography.bodySmall)\\n  else if(points.isNotEmpty())Text(\\"Prediction needs 3 measurements spanning 7 days.\\",style=MaterialTheme.typography.bodySmall)\\n }\\n}\\n\\n"}, "app/src/test/java/com/example/caloriecounter/CategoryDateTest.kt": {"previous_sha256": null, "text": "package com.example.caloriecounter\\nimport org.junit.Test\\nimport org.junit.Assert.*\\nclass CategoryDateTest{\\n @Test fun ukDayMonthYear(){assertEquals(\\"09-11-2026\\",ukDate(\\"2026-11-09\\"))}\\n @Test fun leadingZeroes(){assertEquals(\\"03-01-2026\\",ukDate(\\"2026-01-03\\"))}\\n @Test fun leapDate(){assertEquals(\\"29-02-2024\\",ukDate(\\"2024-02-29\\"))}\\n @Test fun missingDateSafe(){assertEquals(\\"\\",ukDate(\\"\\"))}\\n @Test fun invalidDateSafe(){assertEquals(\\"bad\\",ukDate(\\"bad\\"))}\\n @Test fun trimName(){assertEquals(\\"Lunch\\",validatedCategoryName(\\" Lunch \\",emptyList()))}\\n @Test(expected=IllegalArgumentException::class) fun blankRejected(){validatedCategoryName(\\" \\",emptyList())}\\n @Test(expected=IllegalArgumentException::class) fun reservedRejected(){validatedCategoryName(\\"ALL ITEMS\\",emptyList())}\\n @Test(expected=IllegalArgumentException::class) fun duplicateRejected(){validatedCategoryName(\\"lunch\\",listOf(UserCategory(\\"1\\",\\"Lunch\\")))}\\n @Test fun renameRetainsId(){assertEquals(\\"Lunch\\",validatedCategoryName(\\"Lunch\\",listOf(UserCategory(\\"1\\",\\"Lunch\\")),\\"1\\"))}\\n @Test fun restoreRemapsIds(){assertEquals(mapOf(\\"12\\" to \\"newcat\\"),remapCategoryItems(mapOf(\\"3\\" to \\"oldcat\\"),mapOf(\\"3\\" to \\"12\\"),mapOf(\\"oldcat\\" to \\"newcat\\")))}\\n @Test fun legacyBackupUncategorised(){assertTrue(remapCategoryItems(emptyMap(),mapOf(\\"3\\" to \\"12\\"),emptyMap()).isEmpty())}\\n @Test fun unknownItemSkipped(){assertTrue(remapCategoryItems(mapOf(\\"missing\\" to \\"c\\"),emptyMap(),mapOf(\\"c\\" to \\"d\\")).isEmpty())}\\n @Test fun unknownCategorySkipped(){assertTrue(remapCategoryItems(mapOf(\\"3\\" to \\"missing\\"),mapOf(\\"3\\" to \\"12\\"),emptyMap()).isEmpty())}\\n}\\n"}, "app/src/test/java/com/example/caloriecounter/DailyImprovementsTest.kt": {"previous_sha256": "5b6ae5af3a57d43aba0ad7d8d73efee548b6ea79e31b720125c4a0c26f184ecc", "text": "package com.example.caloriecounter\\nimport org.junit.Test\\nimport org.junit.Assert.*\\nclass DailyImprovementsTest{\\n private fun w(id:Long,date:String,kg:Double)=WeightRecord(id=id,date=date,kg=kg)\\n @Test fun firstWeight(){assertEquals(\\"Starting weight saved\\",weightSaveNotice(emptyList(),w(0,\\"2026-01-01\\",90.0),WeightUnit.KG))}\\n @Test fun backdated(){assertEquals(\\"Measurement saved\\",weightSaveNotic