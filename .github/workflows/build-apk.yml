name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip Android project
        run: unzip -o CalorieCounter.zip

      - name: Apply recipe and food search update
        run: python3 update_app.py

      - name: Add nutrition totals and history
        run: python3 update_nutrition.py

      - name: Fix missing launcher icon reference
        run: |
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@android:drawable/ic_menu_compass"|' CalorieCounter/app/src/main/AndroidManifest.xml

      - name: Fix missing launcher icon reference
        run: |
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@android:drawable/ic_menu_compass"|' CalorieCounter/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle -p CalorieCounter assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calorie-counter-debug-apk
          path: CalorieCounter/app/build/outputs/apk/debug/app-debug.apk
