name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip Android project
        run: unzip -o CalorieCounter.zip

      - name: Apply recipe and food search update
        run: python3 update_app.py

      - name: Add nutrition totals and history
        run: python3 update_nutrition.py

      - name: Repair corrupted Kotlin search line
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("CalorieCounter/app/src/main/java/com/example/caloriecounter/ui/FoodPicker.kt")
          text = path.read_text()
          lines = text.splitlines()

          replacement = '        if (!response.isSuccessful) error("Search failed (${response.code})")'
          count = sum("get_ipython" in line for line in lines)

          if count > 1:
              raise SystemExit("Unexpected extra corrupted lines; stopping for inspection.")

          fixed = [
              replacement if "get_ipython" in line else line
              for line in lines
          ]
          path.write_text("".join(fixed) + "")
          print(f"Repaired {count} corrupted Kotlin line(s).")
          PY

      - name: Fix missing launcher icon reference
        run: |
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@android:drawable/ic_menu_compass"|' CalorieCounter/app/src/main/AndroidManifest.xml

      - name: Fix missing launcher icon reference
        run: |
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@android:drawable/ic_menu_compass"|' CalorieCounter/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle -p CalorieCounter assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calorie-counter-debug-apk
          path: CalorieCounter/app/build/outputs/apk/debug/app-debug.apk
