    - name: Test and build APK
      run: gradle -p CalorieCounter testDebugUnitTest assembleDebug --console=plain
    - name: Package complete updated source project
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import zipfile,json
        root=Path('CalorieCounter')
        with zipfile.ZipFile('CalorieCounter-updated.zip','w',zipfile.ZIP_DEFLATED) as archive:
         for p in sorted(root.rglob('*')):
          if p.is_file() and not any(part in {'build','.gradle','.git'} for part in p.parts) and p.name!='local.properties':archive.write(p,p.as_posix())
        with zipfile.ZipFile('CalorieCounter-updated.zip') as archive:
         assert archive.testzip() is None
        Path('sorting-search-scanner-report.json').write_text(json.dumps({'version':'3.9-sorting-search-scanner','popularity_source':'Existing retained diary records, including dates before this update','sorting':['Alphabetical A-Z','Alphabetical Z-A','Most popular','Recently used'],'scanner':'Three matching valid readings spanning at least 180ms; one lookup at a time; camera retained on lookup errors','tests_added':11},indent=2))
        PY
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: diet-tracker-3.9-sorting-search-scanner-apk
        path: CalorieCounter/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
    - name: Upload complete updated project
      uses: actions/upload-artifact@v4
      with:
        name: diet-tracker-3.9-source-project
        path: |-
          CalorieCounter-updated.zip
          sorting-search-scanner-report.json
        if-no-files-found: error
    - name: Upload source and test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sorting-search-scanner-source-and-reports
        path: |-
          CalorieCounter/app/src/main
          CalorieCounter/app/src/test
          CalorieCounter/app/build/reports/tests
        if-no-files-found: warn
