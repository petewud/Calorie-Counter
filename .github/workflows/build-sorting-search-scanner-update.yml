name: Build sorting search and scanner update
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/build-sorting-search-scanner-update.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-35 build-tools;35.0.0
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: calorie-counter-debug-signing-v1
    - name: Apply previous working updates
      run: |
        python3 -m pip install --quiet PyYAML Pillow
        python3 - <<'PY'
        from pathlib import Path
        import yaml,subprocess
        w=yaml.safe_load(Path('.github/workflows/build-unified-calendars-update.yml').read_text())
        for name in ['Apply previous updates','Unify all app calendars']:
         step=next(s for s in w['jobs']['update']['steps'] if s.get('name')==name)
         subprocess.run(['bash','-e','-c',step['run']],check=True)
        PY
    - name: Apply sorting search and scanner update
      run: "python3 - <<'PY'\nCOMMON='package com.example.caloriecounter\\nimport androidx.compose.foundation.layout.*\\nimport androidx.compose.material.icons.Icons\\\
        nimport androidx.compose.material.icons.filled.Sort\\nimport androidx.compose.material.icons.filled.Check\\nimport androidx.compose.material3.*\\\
        nimport androidx.compose.runtime.*\\nimport androidx.compose.ui.Modifier\\nimport java.util.Locale\\n\\ndata class UsageScore(val count:Int=0,val\
        \ date:String=\"\",val id:Long=0)\\nfun usageScore(entries:List<Entry>):UsageScore{val last=entries.maxWithOrNull(compareBy<Entry>{it.date}.thenBy{it.id});return\
        \ UsageScore(entries.size,last?.date?:\"\",last?.id?:0)}\\nfun normalizedName(s:String)=s.trim().lowercase(Locale.UK).replace(Regex(\"\
        \\\\\\\\s+\"),\" \")\\nclass UsageIndex(entries:List<Entry>,recipes:List<Recipe>,favourites:List<Favourite>){\\n private val history=entries.filter{it.date<=java.time.LocalDate.now().toString()}\\\
        n private val recipeNames=recipes.groupingBy{normalizedName(it.name)}.eachCount()\\n private val favouriteNames=favourites.groupingBy{normalizedName(it.ingredient.food.name)+\"\
        |\"+normalizedName(it.ingredient.food.brand)}.eachCount()\\n fun recipe(r:Recipe):UsageScore=usageScore(history.filter{e->e.food.barcode==\"\
        recipe:${r.id}\"||(e.unit==\"portion\"&&normalizedName(e.food.name)==normalizedName(r.name)&&recipeNames[normalizedName(r.name)]==1)})\\\
        n fun favourite(f:Favourite):UsageScore{\\n  val i=f.ingredient;val name=normalizedName(i.food.name);val brand=normalizedName(i.food.brand)\\\
        n  return usageScore(history.filter{e->favouriteId(Ingredient(e.food,e.amount,e.unit,e.unitGrams))==f.id||\\n   (i.food.barcode.startsWith(\"\
        recipe:\")&&e.unit==\"portion\"&&normalizedName(e.food.name)==name&&recipeNames[name]==1)||\\n   (e.food.barcode.isBlank()&&!i.food.barcode.startsWith(\"\
        recipe:\")&&normalizedName(e.food.name)==name&&normalizedName(e.food.brand)==brand&&favouriteNames[name+\"|\"+brand]==1)})\\n }\\n}\\\
        nfun <T> sortedUsage(items:List<T>,order:String,name:(T)->String,score:(T)->UsageScore):List<T>{\\n val alpha=compareBy<T>{normalizedName(name(it))}\\\
