      - name: Test and build APK
        run: gradle -p CalorieCounter testDebugUnitTest assembleDebug --console=plain
      - name: Upload replacement project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-widget-update-project
          path: |
            CalorieCounter-updated.zip
            ui-update-report.json
          if-no-files-found: warn
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calorie-counter-debug-apk
          path: CalorieCounter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
