name: Build home widget and icon update

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/build-home-update.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore existing signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: calorie-counter-debug-signing-v1
      - name: Prepare complete replacement ZIP
        run: |
          unzip -q CalorieCounter.zip
          python3 - <<'PY'
          from pathlib import Path
          import json,re,base64,zipfile,hashlib
          root=Path('CalorieCounter')
          pkg=root/'app/src/main/java/com/example/caloriecounter'
          if not (pkg/'RestaurantScreen.kt').exists():
              raise SystemExit('Use the combined restaurant project ZIP as CalorieCounter.zip first; stopping to avoid losing restaurant features.')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'app/src/main/assets').glob('*') if p.is_file()}
          def change(path,old,new):
              text=path.read_text()
              if text.count(old)!=1: raise SystemExit('Unexpected source marker in '+str(path)+': '+old[:100])
              path.write_text(text.replace(old,new),encoding='utf-8')
          change(pkg/'Models.kt','val targetWeightDate:String?=null','val targetWeightDate:String?=null,val autoCalorieTarget:Boolean=false,val autoGoalEligible:Boolean=false')
          with (pkg/"Models.kt").open("a",encoding="utf-8") as f: f.write('\ndata class CalorieGoalEstimate(val calories:Double?,val limited:Boolean=false,val message:String="")\nfun calorieGoalEstimate(p:Profile,today:LocalDate=LocalDate.now()):CalorieGoalEstimate{\n if(!p.autoGoalEligible)return CalorieGoalEstimate(null,message="Confirm eligibility before enabling automatic estimates.")\n if(p.age !in 18..120||!p.height.isFinite()||p.height<=0||!p.weight.isFinite()||p.weight<=0||p.sex !in listOf("Male","Female"))return CalorieGoalEstimate(null,message="Valid adult profile details are required.")\n val goal=p.targetWeight?.takeIf{it.isFinite()&&it>0}?:return CalorieGoalEstimate(null,message="Set a target weight first.")\n val date=p.targetWeightDate?.let{runCatching{LocalDate.parse(it)}.getOrNull()}?:return CalorieGoalEstimate(null,message="Set a target date first.")\n val days=date.toEpochDay()-today.toEpochDay()\n if(days<=0)return CalorieGoalEstimate(null,message="The target date has passed. Automatic estimates are paused.")\n val metres=p.height/100.0\n if(p.weight/(metres*metres)<18.5||goal/(metres*metres)<18.5)return CalorieGoalEstimate(null,message="Automatic adjustment is unavailable for underweight current or target weights. Seek individual advice.")\n val maintenance=p.estimate()\n if(!maintenance.isFinite()||maintenance<=0)return CalorieGoalEstimate(null,message="Cannot estimate maintenance calories from this profile.")\n // A rough starting estimate, not the dynamic NIH Body Weight Planner model.\n val wanted=(goal-p.weight)*7700.0/days.toDouble()\n val adjustment=wanted.coerceIn(-500.0,300.0)\n val floor=if(p.sex=="Male")1500.0 else 1200.0\n val actual=maxOf(floor,maintenance+adjustment)\n val limited=kotlin.math.abs(wanted-adjustment)>0.5||actual>maintenance+adjustment+0.5\n return CalorieGoalEstimate(kotlin.math.round(actual),limited,if(limited)"Limited estimate: this deadline may not be achievable within the app\'s limits. Choose a later date or seek individual advice."else "Approximate starting target; weight change is not guaranteed and metabolism changes over time.")\n}\n\nfun calorieFill(used:Double,target:Double):Int=if(target>0&&used.isFinite()&&target.isFinite())((used/target).coerceIn(0.0,1.0)*1000).toInt()else 0\n')
          change(pkg/'Store.kt','fun profile():Profile{','fun profile():Profile{\n  val p=storedProfile()\n  if(!p.autoCalorieTarget)return p\n  val weight=weights().lastOrNull()?.kg?:p.weight\n  val plan=calorieGoalEstimate(p.copy(weight=weight))\n  return if(plan.calories==null)p else p.copy(weight=weight,targets=p.targets.toMutableList().also{it[0]=plan.calories})\n }\n private fun storedProfile():Profile{')
          change(pkg/'MainActivity.kt','if(event==androidx.lifecycle.Lifecycle.Event.ON_RESUME){version++;','if(event==androidx.lifecycle.Lifecycle.Event.ON_RESUME){profile=store.profile();version++;')
          change(pkg/'MainActivity.kt','profile=p;store.saveProfile(p)','store.saveProfile(p);profile=store.profile()')
          p=pkg/'MainActivity.kt';text=p.read_text()
          text,count=re.subn(r'^ fun refreshWeightProfile\(\).*$', ' fun refreshWeightProfile(){store.weights().lastOrNull()?.let{store.saveProfile(profile.copy(weight=it.kg))};profile=store.profile();version++}',text,flags=re.M)
          if count!=1:raise SystemExit('Cannot find weight/profile refresh function')
          p.write_text(text)
          change(pkg/'DiaryRecipes.kt','fun NutrientBars(n:Nutrients,profile:Profile){','fun NutrientBars(n:Nutrients,profile:Profile,showMissingNote:Boolean=true){')
          change(pkg/'DiaryRecipes.kt','if((0..7).any{n[it]!=null&&n.missing(it)>0})','if(showMissingNote&&(0..7).any{n[it]!=null&&n.missing(it)>0})')
          change(pkg/"DiaryRecipes.kt",'val total=sumNutrients(entries.map{it.total()})','val total=sumNutrients(entries.map{it.total()});var totalsExpanded by androidx.compose.runtime.saveable.rememberSaveable(date){mutableStateOf(false)}')
          change(pkg/"DiaryRecipes.kt",'Card(Modifier.fillMaxWidth()){Column(Modifier.padding(14.dp),verticalArrangement=Arrangement.spacedBy(12.dp)){','Card(onClick={totalsExpanded=!totalsExpanded},modifier=Modifier.fillMaxWidth()){Column(Modifier.padding(14.dp),verticalArrangement=Arrangement.spacedBy(12.dp)){')
          change(pkg/"DiaryRecipes.kt",'NutrientBars(total,profile)','if(totalsExpanded)NutrientBars(total,profile,false)else CalorieSummary(total,profile);Text(if(totalsExpanded)"Hide nutrition ▴"else "Show nutrition ▾",style=MaterialTheme.typography.labelSmall)')
          change(pkg/"DiaryRecipes.kt",'Text("References are guides, not personalised RDAs. Fat, saturated fat and salt are limits; fibre is a goal. Total sugars is not a free-sugars allowance.",style=MaterialTheme.typography.bodySmall);',"")
          with (pkg/"DiaryRecipes.kt").open("a",encoding="utf-8") as f:f.write('\n@Composable\nfun CalorieSummary(n:Nutrients,profile:Profile){\n val target=profile.targets[0].coerceAtLeast(0.01);val used=n[0]?:0.0\n Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.SpaceBetween){Text("Calories");Text("${numberText(used,0)} / ${compact(target)}kcal")}\n LinearProgressIndicator(progress={(used/target).toFloat().coerceIn(0f,1f)},modifier=Modifier.fillMaxWidth())\n}\n')
          RESOURCES={'app/src/main/java/com/example/caloriecounter/ProfileScreen.kt': '@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\npackage com.example.caloriecounter\nimport android.app.DatePickerDialog\nimport androidx.activity.compose.rememberLauncherForActivityResult\nimport androidx.activity.result.contract.ActivityResultContracts\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.verticalScroll\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.unit.dp\nimport java.time.LocalDate\n@Composable\nfun ProfileScreen(initial:Profile,onboarding:Boolean,store:Store,onSave:(Profile)->Unit){\n val context=LocalContext.current\n var sex by remember{mutableStateOf(if(onboarding)""else initial.sex)};var age by remember{mutableStateOf(if(onboarding)""else initial.age.toString())}\n var height by remember{mutableStateOf(if(onboarding)""else initial.height.toString())};var weight by remember{mutableStateOf(if(onboarding)""else initial.weight.toString())}\n var targetWeight by remember{mutableStateOf(initial.targetWeight?.toString().orEmpty())};var goalDate by remember{mutableStateOf(initial.targetWeightDate)}\n var activity by remember{mutableDoubleStateOf(initial.activity)};var uk by remember{mutableStateOf(initial.ukFirst)};var estimate by remember{mutableStateOf(onboarding)}\n var auto by remember{mutableStateOf(initial.autoCalorieTarget)};var eligible by remember{mutableStateOf(initial.autoGoalEligible)}\n val targets=remember{mutableStateListOf<String>().apply{addAll(initial.targets.map{it.toString()})}};var message by remember{mutableStateOf("")}\n val a=age.toIntOrNull();val h=height.toDoubleOrNull();val w=weight.toDoubleOrNull();val goal=targetWeight.toDoubleOrNull()\n val valid=sex in listOf("Female","Male")&&a!=null&&a in 18..120&&h!=null&&h.isFinite()&&h in 100.0..250.0&&w!=null&&w.isFinite()&&w in 25.0..400.0\n val goalValid=if(targetWeight.isBlank())!onboarding else goal!=null&&goal.isFinite()&&goal in 25.0..400.0\n val kcal=if(valid)estimateCalories(sex,a!!,h!!,w!!,activity)else null\n val numbers=targets.mapIndexed{i,t->if(i==0&&auto)initial.targets[0]else if(i==0&&estimate)kcal else t.toDoubleOrNull()}\n val numbersValid=numbers.all{it!=null&&it.isFinite()&&it>0}\n val candidate=Profile(true,sex,a?:30,h?:170.0,w?:70.0,activity,numbers.map{it?:2000.0},uk,goal,goalDate,auto,eligible)\n val plan=calorieGoalEstimate(candidate)\n val export=rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument("application/json")){uri->if(uri!=null)runCatching{context.contentResolver.openOutputStream(uri)?.bufferedWriter()?.use{it.write(store.exportBackup())}?:error("Cannot open backup")}.onSuccess{message="Backup saved."}.onFailure{message="Backup failed: ${it.message}"}}\n val importer=rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()){uri->if(uri!=null)runCatching{val raw=context.contentResolver.openInputStream(uri)?.bufferedReader()?.use{it.readText()}?:error("Cannot read backup");store.importBackup(raw)}.onSuccess{onSave(store.profile())}.onFailure{message="Import failed: ${it.message}"}}\n Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()).imePadding().padding(16.dp),verticalArrangement=Arrangement.spacedBy(12.dp)){\n  Text(if(onboarding)"Set up your profile"else "Settings",style=MaterialTheme.typography.headlineMedium)\n  Text("For adults 18+. Energy estimates are not a prescribed diet. Not suitable for pregnancy, breastfeeding, eating disorders or conditions/treatments requiring individual dietary advice.")\n  Text("Sex coefficient used by the energy equation")\n  Row{FilterChip(selected=sex=="Female",onClick={sex="Female"},label={Text("Female")});Spacer(Modifier.width(8.dp));FilterChip(selected=sex=="Male",onClick={sex="Male"},label={Text("Male")})}\n  NumericField(age,{age=it},"Age (years, 18+)");NumericField(height,{height=it},"Height (cm)");NumericField(weight,{weight=it},"Weight (kg)");NumericField(targetWeight,{targetWeight=it},"Target weight (kg)")\n  Row{OutlinedButton(onClick={val d=goalDate?.let{runCatching{LocalDate.parse(it)}.getOrNull()}?:LocalDate.now().plusDays(90);DatePickerDialog(context,{_,y,m,day->goalDate=LocalDate.of(y,m+1,day).toString()},d.year,d.monthValue-1,d.dayOfMonth).apply{datePicker.minDate=LocalDate.now().plusDays(1).atStartOfDay(java.time.ZoneId.systemDefault()).toInstant().toEpochMilli()}.show()}){Text(goalDate?.let{"Target date: $it"}?:"Target date (optional)")};if(goalDate!=null)TextButton(onClick={goalDate=null;auto=false}){Text("Clear")}}\n  Text("Activity")\n  listOf("Sedentary" to 1.2,"Lightly active" to 1.375,"Moderately active" to 1.55,"Very active" to 1.725).forEach{(label,value)->Row{RadioButton(selected=activity==value,onClick={activity=value});TextButton(onClick={activity=value}){Text(label)}}}\n  Text("Estimated maintenance: ${numberText(kcal,0)}kcal/day")\n  Row{Switch(checked=auto,enabled=auto||(valid&&goalValid&&goal!=null&&goalDate!=null),onCheckedChange={auto=it;if(it)estimate=false});Text("Automatically estimate calories for target weight/date",Modifier.weight(1f).padding(8.dp))}\n  if(auto){\n   Row{Checkbox(checked=eligible,onCheckedChange={eligible=it});Text("I am 18+, not pregnant or breastfeeding, and do not need a medically supervised or eating-disorder nutrition plan.",Modifier.weight(1f).padding(top=8.dp))}\n   Text("Estimated daily target: ${numberText(plan.calories,0)}kcal",style=MaterialTheme.typography.titleMedium)\n   Text(plan.message)\n   Text("Uses estimated maintenance plus a rough 7,700kcal/kg energy adjustment over the remaining days. Not a guarantee of reaching the target. Limits: at most a 500kcal/day reduction or 300kcal/day increase; minimum 1,200kcal/day for the female coefficient or 1,500 for male. These limits do not establish an individually safe intake. Estimates pause after the target date or for an underweight current/target BMI. Review with a qualified professional if appropriate.",style=MaterialTheme.typography.bodySmall)\n  }\n  Row{Switch(checked=estimate,enabled=!auto,onCheckedChange={estimate=it});Text("Use maintenance estimate as calorie target",Modifier.weight(1f).padding(8.dp))}\n  Text("Daily targets and references",style=MaterialTheme.typography.titleLarge)\n  nutrientNames.forEachIndexed{i,label->if(i==0&&auto)Text("Calorie target: ${numberText(plan.calories,0)}kcal")else if(i==0&&estimate)Text("Calorie target: ${numberText(kcal,0)}kcal")else NumericField(targets[i],{targets[i]=it},"$label (${nutrientUnits[i]}/day)")}\n  Text("Other starting values are general label references and a fibre goal, not personalised RDAs. Fat, saturated fat and salt are limits. Total sugars is not a free-sugars allowance.",style=MaterialTheme.typography.bodySmall)\n  Row{Switch(checked=uk,onCheckedChange={uk=it});Text("Prioritise UK-labelled results",Modifier.padding(8.dp))}\n  val dateValid=goalDate==null||(goal!=null&&runCatching{LocalDate.parse(goalDate!!)}.isSuccess)\n  Button(enabled=valid&&goalValid&&numbersValid&&dateValid&&(!auto||plan.calories!=null),onClick={onSave(candidate)},modifier=Modifier.fillMaxWidth()){Text("Save settings")}\n  if(!onboarding){HorizontalDivider();Button(onClick={export.launch("calorie-counter-backup.json")}){Text("Export diary, recipes, weights and profile")};OutlinedButton(onClick={importer.launch(arrayOf("application/json","text/plain","application/octet-stream"))}){Text("Import backup (merge)")};Text("Import adds diary/recipe records; existing weight dates are skipped.",style=MaterialTheme.typography.bodySmall)}\n  Text(message)\n  Text("Food data: Open Food Facts (ODbL) and collected MenuTracker restaurant records. Verify source nutrition and portion sizes. Data is local except food searches/barcode requests.",style=MaterialTheme.typography.bodySmall)\n }\n}\n', 'app/src/main/java/com/example/caloriecounter/CalorieWidget.kt': 'package com.example.caloriecounter\nimport android.app.PendingIntent\nimport android.appwidget.AppWidgetManager\nimport android.appwidget.AppWidgetProvider\nimport android.content.ComponentName\nimport android.content.Context\nimport android.content.Intent\nimport android.os.Bundle\nimport android.widget.RemoteViews\nimport java.time.LocalDate\nclass CalorieWidget:AppWidgetProvider(){\n override fun onUpdate(context:Context,manager:AppWidgetManager,ids:IntArray){refresh(context)}\n override fun onAppWidgetOptionsChanged(context:Context,manager:AppWidgetManager,id:Int,options:Bundle){refresh(context)}\n override fun onReceive(context:Context,intent:Intent){super.onReceive(context,intent);refresh(context)}\n companion object{fun refresh(context:Context){val manager=AppWidgetManager.getInstance(context);val ids=manager.getAppWidgetIds(ComponentName(context,CalorieWidget::class.java));if(ids.isEmpty())return;runCatching{Store(context).use{store->val total=sumNutrients(store.entries(LocalDate.now().toString()).map{it.total()});val used=total[0]?:0.0;val target=store.profile().targets[0];val remaining=target-used;val views=RemoteViews(context.packageName,R.layout.calorie_widget)\n  views.setProgressBar(R.id.widget_fill,1000,calorieFill(used,target),false)\n  views.setTextViewText(R.id.widget_used,"${numberText(used,0)} / ${compact(target)}kcal"+if(total.missing(0)>0)"*"else "")\n  views.setTextViewText(R.id.widget_left,if(remaining>=0)"${numberText(remaining,0)}kcal remaining"else "${numberText(-remaining,0)}kcal over target")\n  val open=PendingIntent.getActivity(context,0,Intent(context,MainActivity::class.java),PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE);views.setOnClickPendingIntent(R.id.widget_root,open);manager.updateAppWidget(ids,views)\n }}}}\n}\n', 'app/src/main/res/layout/calorie_widget.xml': '<FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/widget_root" android:layout_width="match_parent" android:layout_height="match_parent" android:background="@drawable/widget_background" android:clipToOutline="true">\n <ProgressBar android:id="@+id/widget_fill" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="match_parent" android:padding="0dp" android:max="1000" android:indeterminate="false" android:progressDrawable="@drawable/widget_progress" android:progressTint="#303030" android:progressBackgroundTint="#1a1a1a"/>\n <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:padding="6dp">\n  <TextView android:id="@+id/widget_used" android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="center" android:textColor="#FFFFFF" android:textSize="14sp" android:textStyle="bold" android:maxLines="1" android:ellipsize="end"/>\n  <TextView android:id="@+id/widget_left" android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="center" android:textColor="#FFFFFF" android:textSize="12sp" android:maxLines="1" android:ellipsize="end"/>\n </LinearLayout>\n</FrameLayout>', 'app/src/main/res/drawable/widget_progress.xml': '<layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><solid android:color="#1a1a1a"/></shape></item><item android:id="@android:id/progress"><clip android:clipOrientation="horizontal" android:gravity="left"><shape><solid android:color="#303030"/></shape></clip></item></layer-list>', 'app/src/main/res/drawable/widget_background.xml': '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#1a1a1a"/><corners android:radius="16dp"/></shape>', 'app/src/main/res/values/icon_colors.xml': '<resources><color name="launcher_background">#1eb05f</color></resources>', 'app/src/main/res/mipma