name: Build weight units update

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/build-weight-units-update.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore existing signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: calorie-counter-debug-signing-v1
      - name: Apply cumulative updates and weight units
        run: |
          unzip -q CalorieCounter.zip
          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib
          root=Path('CalorieCounter');pkg=root/'app/src/main/java/com/example/caloriecounter'
          assets_before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'app/src/main/assets').rglob('*') if p.is_file()}
          icons_before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'app/src/main/res').rglob('*') if p.is_file() and ('launcher' in p.name or p.name=='icon_colors.xml')}
          def run_preparation(name):
              path=Path('.github/workflows')/name
              if not path.exists():raise SystemExit('Keep '+name+' in .github/workflows; it supplies earlier cumulative changes.')
              lines=path.read_text().splitlines();starts=[i for i,line in enumerate(lines) if line.strip()=="python3 - <<'PY'"]
              if not starts:raise SystemExit('Cannot find preparation script in '+name)
              start=starts[0];indent=len(lines[start])-len(lines[start].lstrip())
              end=next((i for i in range(start+1,len(lines)) if lines[i].strip()=='PY' and len(lines[i])-len(lines[i].lstrip())==indent),None)
              if end is None:raise SystemExit('Preparation terminator missing in '+name)
              exec(compile(chr(10).join(line[indent:] if line.strip() else '' for line in lines[start+1:end]),name,'exec'),{})
          if 'fun toggledFavourites(' not in (pkg/'Models.kt').read_text():run_preparation('build-favourites-star-update.yml')
          nav=Path('.github/workflows/build-navigation-graph-update.yml')
          if nav.exists() and 'GraphViewportRange' not in (pkg/'Models.kt').read_text():run_preparation(nav.name)
          fixed=Path('.github/workflows/build-fixed-favourites-update.yml')
          if fixed.exists() and 'fun appWeightForecast(' not in (pkg/'AppWeightForecast.kt').read_text():run_preparation(fixed.name)
          if 'fun toggledFavourites(' not in (pkg/'Models.kt').read_text():raise SystemExit('Favourites update did not apply')
          def skip_comment(s,i):
              if s.startswith('//',i):
                  j=s.find(chr(10),i);return len(s) if j<0 else j+1
              if s.startswith('/*',i):
                  depth=1;i+=2
                  while i<len(s) and depth:
                      if s.startswith('/*',i):depth+=1;i+=2
                      elif s.startswith('*/',i):depth-=1;i+=2
                      else:i+=1
                  if depth:raise ValueError('Unterminated Kotlin comment')
                  return i
              return i
          def skip_string(s,i):
              quote=s[i];triple=quote=='"' and s.startswith('"""',i)
              i+=3 if triple else 1
              while i<len(s):
                  if triple and s.startswith('"""',i):return i+3
                  if not triple and s[i]==chr(92):i+=2;continue
                  if not triple and s[i]==quote:return i+1
                  if quote=='"' and s.startswith('${',i):i=balanced_end(s,i+1,'{','}');continue
                  i+=1
              raise ValueError('Unterminated Kotlin string')
          def balanced_end(s,i,left,right):
              if s[i]!=left:raise ValueError('Invalid block start')
              depth=1;i+=1
              while i<len(s):
                  if s.startswith('//',i) or s.startswith('/*',i):i=skip_comment(s,i);continue
                  if s[i] in ('"',"'"):i=skip_string(s,i);continue
                  if s[i]==left:depth+=1
                  elif s[i]==right:
                      depth-=1
                      if depth==0:return i+1
                  i+=1
              raise ValueError('Unterminated Kotlin block')
          def replace_weight_charts(source,replacement):
              pattern=r'(?m)^[ \t]*@Composable[ \t]*\n[ \t]*(?:private[ \t]+)?fun[ \t]+WeightChart[ \t]*\('
              found=list(re.finditer(pattern,source))
              if not found:raise SystemExit('Cannot locate a WeightChart declaration; stopping rather than publishing an incomplete update.')
              spans=[]
              for match in found:
                  start=match.start();paren=match.end()-1;pos=balanced_end(source,paren,'(',')')
                  while pos<len(source):
                      if source.startswith('//',pos) or source.startswith('/*',pos):pos=skip_comment(source,pos);continue
                      if source[pos]=='{':break
                      if source[pos]=='=':raise SystemExit('Expression-bodied chart needs source inspection')
                      pos+=1
                  if pos>=len(source):raise SystemExit('Chart body missing')
                  spans.append((start,balanced_end(source,pos,'{','}')))
              for start,end in reversed(spans):source=source[:start]+(replacement if start==spans[0][0] else '')+source[end:]
              return source,len(spans)
          CHART='@Composable\nprivate fun WeightChart(records:List<WeightRecord>,target:Double?,onSelect:(WeightRecord)->Unit){\n WeightChart(records,target,null,WeightUnit.KG,onSelect)\n}\n@Composable\nprivate fun WeightChart(records:List<WeightRecord>,target:Double?,targetDate:String?,unit:WeightUnit,onSelect:(WeightRecord)->Unit){\n var zoom by remember{mutableFloatStateOf(1f)}\n var pan by remember{mutableStateOf(Offset.Zero)}\n var canvasSize by remember{mutableStateOf(Size.Zero)}\n val density=androidx.compose.ui.platform.LocalDensity.current\n val colors=MaterialTheme.colorScheme\n val points=records.filter{it.kg.isFinite()&&runCatching{LocalDate.parse(it.date)}.isSuccess}.sortedBy{it.date}\n val trend=remember(records,targetDate){appWeightForecast(records,targetDate)}\n val first=points.firstOrNull()?.let{LocalDate.parse(it.date).toEpochDay().toDouble()}?:LocalDate.now().toEpochDay().toDouble()\n val last=points.lastOrNull()?.let{LocalDate.parse(it.date).toEpochDay().toDouble()}?:first\n val goalWeight=target?.takeIf{it.isFinite()}\n val goalDay=targetDate?.let{runCatching{LocalDate.parse(it).toEpochDay().toDouble()}.getOrNull()}?.takeIf{it>first&&goalWeight!=null&&points.isNotEmpty()}\n val end=maxOf(last,goalDay?:last,trend?.endDay?:last)\n val ys=(points.map{it.kg}+listOfNotNull(if(goalDay!=null)goalWeight else null,trend?.let{it.value(it.endDay)})).filter{it.isFinite()}\n val low=ys.minOrNull()?:60.0;val high=ys.maxOrNull()?:80.0\n val padX=maxOf(1.0,maxOf(end-first,1.0)*.06)\n val padY=maxOf(.7,maxOf(high-low,1.0)*.12)\n val minX=first-padX;val maxX=end+padX;val minY=low-padY;val maxY=high+padY\n val goalColor=Color(0xFF2EAB58);val forecastColor=Color(0xFFED9643)\n val labelSize=with(density){11.sp.toPx()};val outer=with(density){10.dp.toPx()};val gap=with(density){8.dp.toPx()}\n val paint=remember(colors.onSurface,labelSize){Paint(Paint.ANTI_ALIAS_FLAG).apply{color=colors.onSurface.toArgb();textSize=labelSize}}\n fun plotBox(s:Size):androidx.compose.ui.geometry.Rect{\n  val labelWidth=listOf(minY,maxY,(minY+maxY)/2).maxOf{paint.measureText(weightAxisDisplay(it,unit))}\n  val left=outer+labelWidth+gap;val top=outer+with(density){8.dp.toPx()}\n  return androidx.compose.ui.geometry.Rect(left,top,maxOf(left+1f,s.width-outer),maxOf(top+1f,s.height-outer-with(density){24.dp.toPx()}))\n }\n fun project(day:Double,kg:Double,s:Size):Offset{\n  val b=plotBox(s);val x=((day-minX)/(maxX-minX)-.5).toFloat();val y=((maxY-kg)/(maxY-minY)-.5).toFloat()\n  return b.center+Offset(x*b.width*zoom,y*b.height*zoom)+pan\n }\n fun point(r:WeightRecord,s:Size)=project(LocalDate.parse(r.date).toEpochDay().toDouble(),r.kg,s)\n Column{\n  TextButton(onClick={zoom=1f;pan=Offset.Zero}){Text("Reset graph")}\n  Surface(tonalElevation=2.dp,shape=MaterialTheme.shapes.medium){\n   Canvas(Modifier.fillMaxWidth().height(280.dp)\n    .onSizeChanged{canvasSize=Size(it.width.toFloat(),it.height.toFloat())}\n    .pointerInput(points,target,targetDate,unit,density.density,density.fontScale){\n     detectTransformGestures{centroid,change,factor,_->\n      val b=plotBox(canvasSize);val next=(zoom*factor).coerceIn(1f,16f)\n      val pivot=Offset(centroid.x.coerceIn(b.left,b.right),centroid.y.coerceIn(b.top,b.bottom))-b.center\n      val moved=(pan-pivot)*(next/zoom)+pivot+change\n      val maxPanX=b.width*(next-1f)/2f;val maxPanY=b.height*(next-1f)/2f\n      zoom=next;pan=Offset(moved.x.coerceIn(-maxPanX,maxPanX),moved.y.coerceIn(-maxPanY,maxPanY))\n     }\n    }\n    .pointerInput(points,target,targetDate,unit,zoom,pan){\n     detectTapGestures{tap->\n      val b=plotBox(canvasSize)\n      if(b.contains(tap))points.minByOrNull{r->val p=point(r,canvasSize);hypot((p.x-tap.x).toDouble(),(p.y-tap.y).toDouble())}?.let{r->\n       if((point(r,canvasSize)-tap).getDistance()<with(density){28.dp.toPx()})onSelect(r)\n      }\n     }\n    }){\n    val b=plotBox(size);val metrics=paint.fontMetrics;paint.textAlign=Paint.Align.RIGHT\n    for(tick in 0..4){\n     val y=b.top+b.height*tick/4f;drawLine(colors.outlineVariant,Offset(b.left,y),Offset(b.right,y))\n     val normalized=.5+((y-b.center.y-pan.y)/(b.height*zoom)).toDouble()\n     val kg=maxY-normalized*(maxY-minY);val baseline=y-(metrics.ascent+metrics.descent)/2f\n     drawContext.canvas.nativeCanvas.drawText(weightAxisDisplay(kg,unit),b.left-gap,baseline,paint)\n    }\n    clipRect(b.left,b.top,b.right,b.bottom){\n     if(goalDay!=null&&goalWeight!=null&&points.isNotEmpty())drawLine(goalColor,project(first,points.first().kg,size),project(goalDay,goalWeight,size),2.dp.toPx())\n     trend?.let{f->drawLine(forecastColor,project(f.startDay,f.startKg,size),project(f.endDay,f.value(f.endDay),size),2.dp.toPx(),pathEffect=androidx.compose.ui.graphics.PathEffect.dashPathEffect(floatArrayOf(12f,8f)))}\n     points.zipWithNext().forEach{(a,bp)->drawLine(colors.primary,point(a,size),point(bp,size),2.dp.toPx())}\n     points.forEach{r->val p=point(r,size);drawCircle(colors.primary,5.dp.toPx(),p);drawCircle(colors.surface,2.dp.toPx(),p)}\n    }\n    val formatter=DateTimeFormatter.ofPattern("d MMM yy")\n    fun dateAt(x:Float):String{\n     val normalized=.5+((x-b.center.x-pan.x)/(b.width*zoom)).toDouble()\n     return LocalDate.ofEpochDay((minX+normalized*(maxX-minX)).toLong()).format(formatter)\n    }\n    val baseline=size.height-outer-metrics.descent\n    paint.textAlign=Paint.Align.LEFT;drawContext.canvas.nativeCanvas.drawText(dateAt(b.left),b.left,baseline,paint)\n    paint.textAlign=Paint.Align.RIGHT;drawContext.canvas.nativeCanvas.drawText(dateAt(b.right),b.right,baseline,paint)\n   }\n  }\n  if(goalDay!=null)Text("Green: goal",color=goalColor,style=MaterialTheme.typography.bodySmall)\n  if(trend!=null)Text("Orange dashed: estimated trend",color=forecastColor,style=MaterialTheme.typography.bodySmall)\n  else if(points.isNotEmpty())Text("Prediction needs 3 measurements spanning 7 days.",style=MaterialTheme.typography.bodySmall)\n }\n}\n'
          UNITS='package com.example.caloriecounter\nimport java.util.Locale\n\nenum class WeightUnit(val id:String,val label:String){KG("kg","Kilograms"),LB("lb","Pounds"),ST("st","Stone and pounds")}\n\nfun kgToLb(kg:Double)=kg*2.2046226218487757\nfun lbToKg(lb:Double)=lb/2.2046226218487757\n\nfun weightDisplay(kg:Double,unit:WeightUnit):String{\n if(!kg.isFinite()||kg<=0)return "--"\n return when(unit){\n  WeightUnit.KG->numberText(kg,1)+" kg"\n  WeightUnit.LB->numberText(kgToLb(kg),1)+" lb"\n  WeightUnit.ST->run{\n   val totalPounds=kotlin.math.round(kgToLb(kg));val stone=(totalPounds/14).toInt();val pounds=(totalPounds%14).toInt()\n   if(stone==0)"${pounds}lb" else "${stone}st ${pounds}lb"\n  }\n }\n}\nfun weightAxisDisplay(kg:Double,unit:WeightUnit):String=when(unit){\n WeightUnit.KG->numberText(kg,1)\n WeightUnit.LB->numberText(kgToLb(kg),0)\n WeightUnit.ST->numberText(kgToLb(kg)/14.0,1)\n}\nfun weightInputToKg(text:String,unit:WeightUnit):Double?{\n val value=text.toDoubleOrNull()?.takeIf{it.isFinite()&&it>0}?:return null\n return when(unit){\n  WeightUnit.KG->value\n  WeightUnit.LB->lbToKg(value)\n  WeightUnit.ST->lbToKg(value*14.0)\n }\n}\nfun weightKgToInput(kg:Double,unit:WeightUnit):String=when(unit){\n WeightUnit.KG->kg.toString()\n WeightUnit.LB->kgToLb(kg).toString()\n WeightUnit.ST->(kgToLb(kg)/14.0).toString()\n}\nfun weightUnitLabel(unit:WeightUnit)=when(unit){\n WeightUnit.KG->"kg"\n WeightUnit.LB->"lb"\n WeightUnit.ST->"st"\n}\nfun parseWeightUnit(id:String?):WeightUnit=WeightUnit.entries.firstOrNull{it.id==id}?:WeightUnit.KG\n'
          TESTS='package com.example.caloriecounter\nimport org.junit.Assert.*\nimport org.junit.Test\nclass WeightUnitsTest{\n @Test fun stoneDisplayRoundsPounds(){assertEquals("14st 8lb",weightDisplay(92.986,WeightUnit.ST));assertEquals("10st 0lb",weightDisplay(63.5029318,WeightUnit.ST))}\n @Test fun poundsDisplay(){assertEquals("204.8 lb",weightDisplay(92.9,WeightUnit.LB))}\n @Test fun kilogramsDisplay(){assertEquals("92.9 kg",weightDisplay(92.9,WeightUnit.KG))}\n @Test fun axisUsesWholePoundsAndStone(){assertEquals("205",weightAxisDisplay(92.986,WeightUnit.LB));assertEquals("14.5",weightAxisDisplay(92.986,WeightUnit.ST))}\n @Test fun stoneInputConvertsToKg(){val kg=weightInputToKg("14.5",WeightUnit.ST)!!;assertEquals(92.05,kg,0.01);assertEquals("14st 7lb",weightDisplay(kg,WeightUnit.ST))}\n @Test fun poundsInputConvertsToKg(){val kg=weightInputToKg("204.8",WeightUnit.LB)!!;assertEquals(92.9,kg,0.01)}\n @Test fun invalidInputRejected(){assertNull(weightInputToKg("abc",WeightUnit.ST));assertNull(weightInputToKg("-1",WeightUnit.LB));assertNull(weightInputToKg("0",WeightUnit.KG))}\n @Test fun unitSelectionPersistsThroughRoundTrip(){for(unit in WeightUnit.entries){val kg=92.986;val text=weightKgToInput(kg,unit);val restored=weightInputToKg(text,unit)!!;assertEquals(kg,restored,0.0001)}}\n @Test fun invalidSavedUnitFallsBackToKg(){assertEquals(WeightUnit.KG,parseWeightUnit(null));assertEquals(WeightUnit.KG,parseWeightUnit("bad"))}\n}\n'
          PROFILE_PATCH='p=pkg/\'ProfileScreen.kt\';text=p.read_text()\nif \'var unit by remember\' not in text:\n    text=text.replace(\'var auto by remember{mutableStateOf(initial.autoCalorieTarget)}\',\'var auto by remember{mutableStateOf(initial.autoCalorieTarget)}\'+chr(10)+\' var unit by remember{mutableStateOf(parseWeightUnit(initial.weightUnit))}\')\ntext=text.replace(\'val w=weight.toDoubleOrNull()\',\'val w=weightInputToKg(weight,unit)\')\ntext=text.replace(\'val kcal=if(valid)estimateCalories(sex,a!!,h!!,w!!,activity)else null\',\'val kcal=if(valid)estimateCalories(sex,a!!,h!!,w!!,activity)else null\'+chr(10)+\' val example=weightDisplay(w?:70.0,unit)\')\ntext=text.replace(\'val goal=targetWeight.toDoubleOrNull()\',\'val goal=weightInputToKg(targetWeight,unit)\')\ntext=text.replace(\'val candidate=Profile(true,sex,a?:30,h?:170.0,w?:70.0,activity,numbers.map{it?:2000.0},uk,goal,goalDate,auto,eligible)\',\'val candidate=Profile(true,sex,a?:30,h?:170.0,w?:70.0,activity,numbers.map{it?:2000.0},uk,goal,goalDate,auto,eligible,unit.id)\')\ntext=text.replace(\'NumericField(weight,{weight=it},"Weight (kg)")\',\'Text("Weight units")\'+chr(10)+\' Row{WeightUnit.entries.forEach{option->FilterChip(selected=unit==option,onClick={unit=option;weight=weightKgToInput(w?:initial.weight,option)},label={Text(option.label)})}}\'+chr(10)+\' Text("Example: $example")\'+chr(10)+\' NumericField(weight,{weight=it},"Weight (${weightUnitLabel(unit)})")\')\ntext=text.replace(\'NumericField(targetWeight,{targetWeight=it},"Target weight (kg)")\',\'NumericField(targetWeight,{targetWeight=it},"Target weight (${weightUnitLabel(unit)})")\')\ntext=text.replace(\'Text("Estimated maintenance: ${numberText(kcal,0)}kcal/day")\',\'Text("Estimated maintenance: ${numberText(kcal,0)}kcal/day")\'+chr(10)+\' Text("Weight shown as: ${weightDisplay(w?:initial.weight,unit)}")\')\ntext=text.replace(\'onSave(candidate)\',\'onSave(candidate.copy(weightUnit=unit.id))\')\np.write_text(text)\n'
          WEIGHT_PATCH='p=pkg/\'WeightScreen.kt\';text=p.read_text()\ntext=text.replace(\'fun WeightScreen(\',\'fun WeightScreen(\'+chr(10)+\' unit:WeightUnit=WeightUnit.KG,\'+chr(10)+\' onUnitChange:(WeightUnit)->Unit={},\')\ntext=text.replace(\'WeightChart(records,target,targetDate,onSelect)\',\'WeightChart(records,target,targetDate,unit,onSelect)\')\ntext=text.replace(\'WeightChart(records,target,targetDate)\',\'WeightChart(records,target,targetDate,unit)\')\ntext=text.replace(\'WeightChart(records,target,onSelect)\',\'WeightChart(records,target,unit,onSelect)\')\ntext=text.replace(\'WeightChart(records,target)\',\'WeightChart(records,target,unit)\')\ntext=text.replace(\'NumericField(kg,{kg=it},"Weight (kg)")\',\'NumericField(weightKgToInput(kg,unit),{kg=weightInputToKg(it,unit)?:kg},"Weight (${weightUnitLabel(unit)})")\')\ntext=text.replace(\'Text(weightDisplay(r.kg))\',\'Text(weightDisplay(r.kg,unit))\')\ntext=text.replace(\'Text(weightDisplay(target))\',\'Text(weightDisplay(target,unit))\')\ntext=text.replace(\'Text(weightDisplay(targetWeight))\',\'Text(weightDisplay(targetWeight,unit))\')\nmarker=\'Text("Weight history",style=MaterialTheme.typography.headlineSmall)\'\nif marker in text:text=text.replace(marker,marker+chr(10)+\' Row{WeightUnit.entries.forEach{option->FilterChip(selected=unit==option,onClick={onUnitChange(option)},label={Text(option.label)})}}\'+chr(10)+\' Text("Example: ${weightDisplay(weights.lastOrNull()?.kg?:70.0,unit)}")\')\np.write_text(text)\n'
          path=pkg/'WeightScreen.kt';original=path.read_text();updated,replaced=replace_weight_charts(original,CHART)
          match=re.search(r'^package\s+com\.example\.caloriecounter\s*$',updated,flags=re.M)
          if not match:raise SystemExit('Unexpected WeightScreen.kt package')
          needed=['androidx.compose.ui.unit.sp','kotlin.math.hypot','android.graphics.Paint','androidx.compose.foundation.Canvas','androidx.compose.foundation.gestures.detectTapGestures','androidx.compose.foundation.gestures.detectTransformGestures','androidx.compose.ui.geometry.Offset','androidx.compose.ui.geometry.Size','androidx.compose.ui.graphics.Color','androidx.compose.ui.graphics.drawscope.clipRect','androidx.compose.ui.graphics.nativeCanvas','androidx.compose.ui.graphics.toArgb','androidx.compose.ui.input.pointer.pointerInput','androidx.compose.ui.layout.onSizeChanged','java.time.LocalDate','java.time.format.DateTimeFormatter']
          existing={line.strip() for line in updated.splitlines() if line.strip().startswith('import ')}
          missing=[name for name in needed if 'import '+name not in existing]
          if missing:updated=updated[:match.end()]+chr(10)+chr(10).join('import '+name for name in missing)+chr(10)+updated[match.end():]
          path.write_text(updated,encoding='utf-8')
          (pkg/'WeightUnits.kt').write_text(UNITS,encoding='utf-8')
          profile_file=None;profile_text=None
          for candidate in pkg.rglob('*.kt'):
              candidate_text=candidate.read_text()
              if re.search(r'\bdata class Profile\s*\(',candidate_text):
                  profile_file=candidate;profile_text=candidate_text;break
          if profile_file is None:
              profile_file=pkg/'Models.kt';profile_text=profile_file.read_text()
              profile_text+='data class Profile(completed:Boolean=false,sex:String="",age:Int=0,height:Double=0.0,weight:Double=0.0,activity:Double=1.2,targets:List<Double>=emptyList(),ukFirst:Boolean=true,targetWeight:Double?=null,targetWeightDate:String?=null,autoCalorieTarget:Boolean=false,autoGoalEligible:Boolean=false,val weightUnit:String="kg")'+chr(10)
              profile_file.write_text(profile_text,encoding='utf-8')
          if 'weightUnit:String' not in profile_text:
              marker='val autoGoalEligible:Boolean=false'
              if profile_text.count(marker)==1:
                  profile_text=profile_text.replace(marker,marker+',val weightUnit:String="kg"')
              else:
                  match=re.search(r'\bdata class Profile\s*\(',profile_text)
                  close=balanced_end(profile_text,match.end()-1,'(',')')
                  profile_text=profile_text[:close-1].rstrip().rstrip(',')+',val weightUnit:String="kg"'+profile_text[close-1:]
              if 'weightUnit:String' not in profile_text:raise SystemExit('Cannot add weight-unit field to Profile')
              profile_file.write_text(profile_text,encoding='utf-8')
          p=pkg/'Store.kt';text=p.read_text()
          if 'fun weightUnit()' not in text:
              pos=text.rfind('}')
              addition=' fun weightUnit():WeightUnit=parseWeightUnit(storedProfile().weightUnit)'+chr(10)+' fun saveWeightUnit(unit:WeightUnit){val p=storedProfile();saveProfile(p.copy(weightUnit=unit.id))}'+chr(10)
              text=text[:pos]+chr(10)+addition+text[pos:];p.write_text(text)
          exec(compile(PROFILE_PATCH,'profile-patch','exec'),globals())
          exec(compile(WEIGHT_PATCH,'weight-patch','exec'),globals())
          p=pkg/'MainActivity.kt';text=p.read_text()
          if 'unit=remember(version){store.weightUnit()}' not in text:
              text=text.replace('WeightScreen(profile','WeightScreen(unit=remember(version){store.weightUnit()},onUnitChange={u->store.saveWeightUnit(u);version++},profile')
              p.write_text(text)
          p=root/"app/src/test/java/com/example/caloriecounter/WeightUnitsTest.kt";p.parent.mkdir(parents=True,exist_ok=True);p.write_text(TESTS,encoding="utf-8")
          p=root/'app/build.gradle.kts';text=p.read_text();match=re.search(r'versionCode\s*=\s*(\d+)',text)
          version=max(19,int(match.group(1))+1) if match else 19
          text=re.sub(r'versionCode\s*=\s*\d+','versionCode = '+str(version),text);text=re.sub(r'versionName\s*=\s*"[^"]+"','versionName = "2.8"',text);p.write_text(text)
          assets_after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'app/src/main/assets').rglob('*') if p.is_file()}
          icons_after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'app/src/main/res').rglob('*') if p.is_file() and ('launcher' in p.name or p.name=='icon_colors.xml')}
          if assets_before!=assets_after or icons_before!=icons_after:raise SystemExit('Existing restaurant or icon assets changed unexpectedly')
          report={'version':'2.8','version_code':version,'chart_declarations_replaced':replaced,'units':['Kilograms','Pounds','Stone and pounds'],'stone_example':'14st 8lb','storage':'Weights remain stored in kilograms; display and input convert immediately.','retained':'Favourites, recipes, navigation, graph and existing assets.','preserved_assets':assets_after,'preserved_icons':icons_after}
          Path('weight-units-report.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          PY
      - name: Test and build APK
        run: gradle -p CalorieCounter testDebugUnitTest assembleDebug --console=plain
      - name: Package complete project after successful tests and build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('CalorieCounter')
          with zipfile.ZipFile('CalorieCounter-updated.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  rel = path.relative_to(root)
                  if path.is_file() and not any(part in {'build', '.gradle', '.git'} for part in rel.parts) and path.name != 'local.properties':
                      archive.write(path, path.as_posix())
          with zipfile.ZipFile('CalorieCounter-updated.zip') as archive:
              assert archive.testzip() is None
          PY
      - name: Upload weight units project
        uses: actions/upload-artifact@v4
        with:
          name: weight-units-update-project
          path: |
            CalorieCounter-updated.zip
            weight-units-report.json
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calorie-counter-debug-apk
          path: CalorieCounter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weight-units-test-reports
          path: CalorieCounter/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
