name: Build weight units update
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/build-weight-units-update.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-35 build-tools;35.0.0
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Restore existing signing key
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: calorie-counter-debug-signing-v1
    - name: Apply source-matched weight units update
      run: "unzip -q CalorieCounter.zip\npython3 - <<'PY'\nfrom pathlib import Path\nimport re,json,hashlib\nroot=Path('CalorieCounter');pkg=root/'app/src/main/java/com/example/caloriecounter'\n\
        def replace(s,old,new,count=1):\n if s.count(old)!=count:raise SystemExit('Source mismatch: '+repr(old)+'; found '+str(s.count(old)))\n\
        \ return s.replace(old,new)\nUNITS='package com.example.caloriecounter\\nimport androidx.compose.runtime.Composable\\\
        nimport androidx.compose.foundation.layout.Column\\nimport androidx.compose.material3.*\\nimport java.util.Locale\\\
        nimport kotlin.math.roundToInt\\n\\nenum class WeightUnit(val id:String,val label:String){KG(\"kg\",\"Kilograms\"\
        ),LB(\"lb\",\"Pounds\"),ST(\"st\",\"Stone and pounds\")}\\nfun parseWeightUnit(id:String?):WeightUnit=WeightUnit.entries.firstOrNull{it.id==id}?:WeightUnit.KG\\\
        nfun weightInputToKg(text:String,unit:WeightUnit):Double?{\\n val v=if(unit==WeightUnit.ST){val parts=text.split(\\\
        '|\\');val st=parts.getOrNull(0)?.toDoubleOrNull()?:0.0;val lb=parts.getOrNull(1)?.toDoubleOrNull()?:0.0;if(parts.all{it.isBlank()}||st<0||lb<0||lb>=14)return\
        \ null;(st*14+lb)/2.2046226218487757}else{text.toDoubleOrNull()?.let{if(unit==WeightUnit.LB)it/2.2046226218487757\
        \ else it}?:return null}\\n return v.takeIf{it.isFinite()&&it>0}\\n}\\nfun weightKgToInput(kg:Double,unit:WeightUnit):String=when(unit){WeightUnit.KG->kg.toString();WeightUnit.LB->(kg*2.2046226218487757).toString();WeightUnit.ST->{val\
        \ total=(kg*2.2046226218487757*10).roundToInt();\"${total/140}|${String.format(Locale.UK,\"%.1f\",(total%140)/10.0)}\"\
        }}\\nfun weightDisplay(kg:Double,unit:WeightUnit):String=when(unit){WeightUnit.KG->numberText(kg)+\" kg\";WeightUnit.LB->numberText(kg*2.2046226218487757)+\"\
        \ lb\";WeightUnit.ST->{val total=(kg*2.2046226218487757).roundToInt();\"${total/14}st ${total%14}lb\"}}\\nfun weightAxisDisplay(kg:Double,unit:WeightUnit):String=when(unit){WeightUnit.KG->numberText(kg);WeightUnit.LB->numberText(kg*2.2046226218487757);WeightUnit.ST->numberText(kg*2.2046226218487757/14)+\"\
        \ st\"}\\n@Composable\\nfun WeightValueField(value:String,onChange:(String)->Unit,label:String,unit:WeightUnit){\\\
        n if(unit==WeightUnit.ST){val parts=value.split(\\'|\\');Column{NumericField(parts.getOrElse(0){\"\"},{onChange(it+\"\
        |\"+parts.getOrElse(1){\"\"})},label+\" (stone)\");NumericField(parts.getOrElse(1){\"\"},{onChange(parts.getOrElse(0){\"\
        \"}+\"|\"+it)},label+\" (pounds, 0\u201313.9)\")}}\\n else NumericField(value,onChange,label+if(unit==WeightUnit.KG)\"\
        \ (kg)\"else \" (lb)\")\\n}\\n@Composable\\nfun WeightUnitPicker(unit:WeightUnit,onChange:(WeightUnit)->Unit){Column{Text(\"\
        Weight units\");WeightUnit.entries.forEach{option->FilterChip(selected=unit==option,onClick={onChange(option)},label={Text(option.label)})}}}\\\
        n'\n\n(pkg/'WeightUnits.kt').write_text(UNITS)\np=pkg/'Store.kt';s=p.read_text();pos=s.rfind('}')\ns=s[:pos]+' fun\
        \ weightUnit():WeightUnit=parseWeightUnit(prefs.getString(\"weightUnit\",\"kg\"))\\n fun saveWeightUnit(unit:WeightUnit){prefs.edit().putString(\"\
        weightUnit\",unit.id).apply()}\\n'+s[pos:];p.write_text(s)\np=pkg/'MainActivity.kt';s=p.read_text()\ns=replace(s,'WeightScreen(records,profile,','WeightScreen(records,profile,unit=store.weightUnit(),onUnitChange={u->store.saveWeightUnit(u);version++},')\n\
        p.write_text(s)\np=pkg/'WeightScreen.kt';s=p.read_text()\ns=replace(s,'fun WeightScreen(records:List<WeightRecord>,profile:Profile,','fun\
        \ WeightScreen(records:List<WeightRecord>,profile:Profile,unit:WeightUnit,onUnitChange:(WeightUnit)->Unit,')\ns=replace(s,'amount.toDoubleOrNull()?.takeIf{it.isFinite()&&it\
        \ in 25.0..400.0}','weightInputToKg(amount,unit)?.takeIf{it in 25.0..400.0}')\ns=replace(s,'NumericField(amount,{amount=it},\"\
        Weight (kg)\")','WeightUnitPicker(unit){next->val old=weightInputToKg(amount,unit);amount=old?.let{weightKgToInput(it,next)}?:\"\
        \";onUnitChange(next)}\\n  WeightValueField(amount,{amount=it},\"Weight\",unit)')\ns=replace(s,'${numberText(current?.kg?:profile.weight)}kg','${weightDisplay(current?.kg?:profile.weight,unit)}')\n\
        s=replace(s,'${numberText(lost)}kg','${weightDisplay(lost,unit)}')\ns=replace(s,'${numberText(-lost)}kg','${weightDisplay(-lost,unit)}')\n\
        s=replace(s,'${numberText(r.kg)}kg','${weightDisplay(r.kg,unit)}',2)\ns=replace(s,'WeightEditDialog(r,records,','WeightEditDialog(r,records,unit,')\n\
        s=replace(s,'private fun WeightEditDialog(record:WeightRecord,records:List<WeightRecord>,','private fun WeightEditDialog(record:WeightRecord,records:List<WeightRecord>,unit:WeightUnit,')\n\
        s=replace(s,'mutableStateOf(record.kg.toString())','mutableStateOf(weightKgToInput(record.kg,unit))')\ns=replace(s,'kg.toDoubleOrNull()?.takeIf{it.isFinite()&&it\
        \ in 25.0..400.0}','weightInputToKg(kg,unit)?.takeIf{it in 25.0..400.0}')\ns=replace(s,'NumericField(kg,{kg=it},\"\
        Weight (kg)\")','WeightValueField(kg,{kg=it},\"Weight\",unit)')\ns=replace(s,'WeightChart(records,profile.targetWeight,profile.targetWeightDate)','WeightChart(records,profile.targetWeight,profile.targetWeightDate,unit)')\n\
        s=replace(s,'WeightChart(records,target,null,onSelect)','WeightChart(records,target,null,WeightUnit.KG,onSelect)')\n\
        s=replace(s,'targetDate:String?,onSelect:(WeightRecord)->Unit','targetDate:String?,unit:WeightUnit,onSelect:(WeightRecord)->Unit')\n\
        s=replace(s,'paint.measureText(numberText(it))','paint.measureText(weightAxisDisplay(it,unit))')\ns=replace(s,'drawText(numberText(kg),','drawText(weightAxisDisplay(kg,unit),')\n\
        s=s.replace('.pointerInput(points,target,targetDate,','.pointerInput(points,target,targetDate,unit,')\np.write_text(s)\n\
        p=pkg/'ProfileScreen.kt';s=p.read_text()\ns=replace(s,' val context=LocalContext.current',' var unit by remember{mutableStateOf(store.weightUnit())}\\\
        n val context=LocalContext.current')\ns=replace(s,'else initial.weight.toString()','else weightKgToInput(initial.weight,unit)')\n\
        s=replace(s,'initial.targetWeight?.toString().orEmpty()','initial.targetWeight?.let{weightKgToInput(it,unit)}.orEmpty()')\n\
        s=replace(s,'val w=weight.toDoubleOrNull()','val w=weightInputToKg(weight,unit)')\ns=replace(s,'val goal=targetWeight.toDoubleOrNull()','val\
        \ goal=weightInputToKg(targetWeight,unit)')\ns=replace(s,'NumericField(weight,{weight=it},\"Weight (kg)\")','WeightValueField(weight,{weight=it},\"\
        Weight\",unit)')\ns=replace(s,'NumericField(targetWeight,{targetWeight=it},\"Target weight (kg)\")','WeightValueField(targetWeight,{targetWeight=it},\"\
        Target weight\",unit)')\ns=replace(s,'  Text(\"Sex coefficient used by the energy equation\")','  WeightUnitPicker(unit){next->val\
        \ old=weightInputToKg(weight,unit);val goalOld=weightInputToKg(targetWeight,unit);weight=old?.let{weightKgToInput(it,next)}?:\"\
        \";targetWeight=goalOld?.let{weightKgToInput(it,next)}?:\"\";unit=next;store.saveWeightUnit(next)}\\n  Text(\"Sex\
        \ coefficient used by the energy equation\")')\np.write_text(s)\np=root/'app/build.gradle.kts';s=p.read_text();v=re.search(r'versionCode\\\
        s*=\\s*(\\d+)',s);version=max(30,int(v.group(1))+1)\ns=re.sub(r'versionCode\\s*=\\s*\\d+','versionCode = '+str(version),s);s=re.sub(r'versionName\\\
        s*=\\s*\"[^\"]+\"','versionName = \"2.9-units\"',s);p.write_text(s)\nassert 'WeightUnitPicker(unit)' in (pkg/'WeightScreen.kt').read_text()\n\
        assert 'WeightUnitPicker(unit)' in (pkg/'ProfileScreen.kt').read_text()\nPath('weight-units-report.json').write_text(json.dumps({'version':'2.9-units','versionCode':version,'input':'Separate\
        \ stone and pounds fields; weights stored in kg','source_sha256':hashlib.sha256(Path('CalorieCounter.zip').read_bytes()).hexdigest()},indent=2))\n\
        \np=root/\"app/src/test/java/com/example/caloriecounter/WeightUnitsTest.kt\";p.parent.mkdir(parents=True,exist_ok=True);p.write_text('package\
        \ com.example.caloriecounter\\nimport org.junit.Test\\nimport org.junit.Assert.*\\nclass WeightUnitsTest{\\n @Test\
        \ fun stoneAndPoundsInput(){assertEquals(205.0/2.2046226218487757,weightInputToKg(\"14|9\",WeightUnit.ST)!!,0.0001)}\\\
        n @Test fun poundsInput(){assertEquals(92.9,weightInputToKg(\"204.8\",WeightUnit.LB)!!,0.01)}\\n @Test fun stoneDisplay(){assertEquals(\"\
        14st 8lb\",weightDisplay(92.986,WeightUnit.ST))}\\n @Test fun rejectInvalidPounds(){assertNull(weightInputToKg(\"\
        14|14\",WeightUnit.ST))}\\n @Test fun kgInput(){assertEquals(70.0,weightInputToKg(\"70\",WeightUnit.KG)!!,0.0001)}\\\
        n}\\n')\n\nPY\n"
    - name: Test and build APK
      run: gradle -p CalorieCounter testDebugUnitTest assembleDebug --console=plain
    - name: Package project
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import zipfile
        with zipfile.ZipFile('CalorieCounter-updated.zip','w',zipfile.ZIP_DEFLATED) as out:
         for p in Path('CalorieCounter').rglob('*'):
          if p.is_file() and not any(x in {'build','.gradle','.git'} for x in p.parts) and p.name!='local.properties':out.write(p,p.as_posix())

        PY
    - name: Upload project
      uses: actions/upload-artifact@v4
      with:
        name: weight-units-update-project
        path: |-
          CalorieCounter-updated.zip
          weight-units-report.json
        if-no-files-found: error
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: calorie-counter-weight-units-2.9-apk
        path: CalorieCounter/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: weight-units-test-reports
        path: CalorieCounter/app/build/reports/tests/testDebugUnitTest
        if-no-files-found: ignore
