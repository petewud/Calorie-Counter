name: Build repaired favourites and graph update

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/build-fixed-favourites-update.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore existing signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: calorie-counter-debug-signing-v1
      - name: Apply cumulative updates and repair chart
        run: |
          unzip -q CalorieCounter.zip
          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib
          root=Path('CalorieCounter');pkg=root/'app/src/main/java/com/example/caloriecounter'
          assets_before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'app/src/main/assets').rglob('*') if p.is_file()}
          icons_before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'app/src/main/res').rglob('*') if p.is_file() and ('launcher' in p.name or p.name=='icon_colors.xml')}
          def run_preparation(name):
              path=Path('.github/workflows')/name
              if not path.exists():raise SystemExit('Keep '+name+' in .github/workflows; it supplies the earlier cumulative changes.')
              lines=path.read_text().splitlines()
              starts=[i for i,line in enumerate(lines) if line.strip()=="python3 - <<'PY'"]
              if not starts:raise SystemExit('Cannot find preparation script in '+name)
              start=starts[0];indent=len(lines[start])-len(lines[start].lstrip())
              end=next((i for i in range(start+1,len(lines)) if lines[i].strip()=='PY' and len(lines[i])-len(lines[i].lstrip())==indent),None)
              if end is None:raise SystemExit('Preparation script terminator missing in '+name)
              code=chr(10).join(line[indent:] if line.strip() else '' for line in lines[start+1:end])
              exec(compile(code,name,'exec'),{})
          if 'fun toggledFavourites(' not in (pkg/'Models.kt').read_text():run_preparation('build-favourites-star-update.yml')
          nav=Path('.github/workflows/build-navigation-graph-update.yml')
          if nav.exists() and 'GraphViewportRange' not in (pkg/'Models.kt').read_text():run_preparation(nav.name)
          if 'fun toggledFavourites(' not in (pkg/'Models.kt').read_text():raise SystemExit('Favourites update did not apply')
          def skip_comment(s,i):
              if s.startswith('//',i):
                  j=s.find(chr(10),i);return len(s) if j<0 else j+1
              if s.startswith('/*',i):
                  depth=1;i+=2
                  while i<len(s) and depth:
                      if s.startswith('/*',i):depth+=1;i+=2
                      elif s.startswith('*/',i):depth-=1;i+=2
                      else:i+=1
                  if depth:raise ValueError('Unterminated Kotlin comment')
                  return i
              return i

          def skip_string(s,i):
              quote=s[i];triple=quote=='"' and s.startswith('"""',i)
              i+=3 if triple else 1
              while i<len(s):
                  if triple and s.startswith('"""',i):return i+3
                  if not triple and s[i]==chr(92):i+=2;continue
                  if not triple and s[i]==quote:return i+1
                  if quote=='"' and s.startswith('${',i):i=balanced_end(s,i+1,'{','}');continue
                  i+=1
              raise ValueError('Unterminated Kotlin string')

          def balanced_end(s,i,left,right):
              if s[i]!=left:raise ValueError('Invalid block start')
              depth=1;i+=1
              while i<len(s):
                  if s.startswith('//',i) or s.startswith('/*',i):i=skip_comment(s,i);continue
                  if s[i] in ('"',"'"):i=skip_string(s,i);continue
                  if s[i]==left:depth+=1
                  elif s[i]==right:
                      depth-=1
                      if depth==0:return i+1
                  i+=1
              raise ValueError('Unterminated Kotlin block')

          def replace_weight_charts(source,replacement):
              pattern=r'(?m)^[ \t]*@Composable[ \t]*\n[ \t]*(?:private[ \t]+)?fun[ \t]+WeightChart[ \t]*\('
              found=list(re.finditer(pattern,source))
              if not found:raise SystemExit('Cannot locate a WeightChart declaration. Source inspection is needed; no app ZIP will be published.')
              spans=[]
              for match in found:
                  start=match.start();paren=match.end()-1
                  pos=balanced_end(source,paren,'(',')')
                  while pos<len(source):
                      if source.startswith('//',pos) or source.startswith('/*',pos):pos=skip_comment(source,pos);continue
                      if source[pos]=='{':break
                      if source[pos]=='=':raise SystemExit('Expression-bodied chart needs source inspection')
                      pos+=1
                  if pos>=len(source):raise SystemExit('Chart body missing')
                  end=balanced_end(source,pos,'{','}')
                  spans.append((start,end))
              for start,end in reversed(spans):source=source[:start]+(replacement if start==spans[0][0] else '')+source[end:]
              return source,len(spans)

          CHART='@Composable\nprivate fun WeightChart(records:List<WeightRecord>,target:Double?,onSelect:(WeightRecord)->Unit){\n WeightChart(records,target,null,onSelect)\n}\n@Composable\nprivate fun WeightChart(records:List<WeightRecord>,target:Double?,targetDate:String?,onSelect:(WeightRecord)->Unit){\n var zoom by remember{mutableFloatStateOf(1f)}\n var pan by remember{mutableStateOf(Offset.Zero)}\n var canvasSize by remember{mutableStateOf(Size.Zero)}\n val density=androidx.compose.ui.platform.LocalDensity.current\n val colors=MaterialTheme.colorScheme\n val points=records.filter{it.kg.isFinite()&&runCatching{LocalDate.parse(it.date)}.isSuccess}.sortedBy{it.date}\n val trend=remember(records,targetDate){appWeightForecast(records,targetDate)}\n val first=points.firstOrNull()?.let{LocalDate.parse(it.date).toEpochDay().toDouble()}?:LocalDate.now().toEpochDay().toDouble()\n val last=points.lastOrNull()?.let{LocalDate.parse(it.date).toEpochDay().toDouble()}?:first\n val goalWeight=target?.takeIf{it.isFinite()}\n val goalDay=targetDate?.let{runCatching{LocalDate.parse(it).toEpochDay().toDouble()}.getOrNull()}?.takeIf{it>first&&goalWeight!=null&&points.isNotEmpty()}\n val end=maxOf(last,goalDay?:last,trend?.endDay?:last)\n val ys=(points.map{it.kg}+listOfNotNull(if(goalDay!=null)goalWeight else null,trend?.let{it.value(it.endDay)})).filter{it.isFinite()}\n val low=ys.minOrNull()?:60.0;val high=ys.maxOrNull()?:80.0\n val padX=maxOf(1.0,maxOf(end-first,1.0)*.06)\n val padY=maxOf(.7,maxOf(high-low,1.0)*.12)\n val minX=first-padX;val maxX=end+padX;val minY=low-padY;val maxY=high+padY\n val goalColor=Color(0xFF2EAB58);val forecastColor=Color(0xFFED9643)\n val labelSize=with(density){11.sp.toPx()};val outer=with(density){10.dp.toPx()};val gap=with(density){8.dp.toPx()}\n val paint=remember(colors.onSurface,labelSize){Paint(Paint.ANTI_ALIAS_FLAG).apply{color=colors.onSurface.toArgb();textSize=labelSize}}\n fun plotBox(s:Size):androidx.compose.ui.geometry.Rect{\n  val labelWidth=listOf(minY,maxY,(minY+maxY)/2).maxOf{paint.measureText(numberText(it))}\n  val left=outer+labelWidth+gap;val top=outer+with(density){8.dp.toPx()}\n  return androidx.compose.ui.geometry.Rect(left,top,maxOf(left+1f,s.width-outer),maxOf(top+1f,s.height-outer-with(density){24.dp.toPx()}))\n }\n fun project(day:Double,kg:Double,s:Size):Offset{\n  val b=plotBox(s);val x=((day-minX)/(maxX-minX)-.5).toFloat();val y=((maxY-kg)/(maxY-minY)-.5).toFloat()\n  return b.center+Offset(x*b.width*zoom,y*b.height*zoom)+pan\n }\n fun point(r:WeightRecord,s:Size)=project(LocalDate.parse(r.date).toEpochDay().toDouble(),r.kg,s)\n Column{\n  TextButton(onClick={zoom=1f;pan=Offset.Zero}){Text("Reset graph")}\n  Surface(tonalElevation=2.dp,shape=MaterialTheme.shapes.medium){\n   Canvas(Modifier.fillMaxWidth().height(280.dp)\n    .onSizeChanged{canvasSize=Size(it.width.toFloat(),it.height.toFloat())}\n    .pointerInput(points,target,targetDate,density.density,density.fontScale){\n     detectTransformGestures{centroid,change,factor,_->\n      val b=plotBox(canvasSize);val next=(zoom*factor).coerceIn(1f,16f)\n      val pivot=Offset(centroid.x.coerceIn(b.left,b.right),centroid.y.coerceIn(b.top,b.bottom))-b.center\n      val moved=(pan-pivot)*(next/zoom)+pivot+change\n      val maxPanX=b.width*(next-1f)/2f;val maxPanY=b.height*(next-1f)/2f\n      zoom=next;pan=Offset(moved.x.coerceIn(-maxPanX,maxPanX),moved.y.coerceIn(-maxPanY,maxPanY))\n     }\n    }\n    .pointerInput(points,target,targetDate,zoom,pan){\n     detectTapGestures{tap->\n      val b=plotBox(canvasSize)\n      if(b.contains(tap))points.minByOrNull{r->val p=point(r,canvasSize);hypot((p.x-tap.x).toDouble(),(p.y-tap.y).toDouble())}?.let{r->\n       if((point(r,canvasSize)-tap).getDistance()<with(density){28.dp.toPx()})onSelect(r)\n      }\n     }\n    }){\n    val b=plotBox(size);val metrics=paint.fontMetrics;paint.textAlign=Paint.Align.RIGHT\n    for(tick in 0..4){\n     val y=b.top+b.height*tick/4f;drawLine(colors.outlineVariant,Offset(b.left,y),Offset(b.right,y))\n     val normalized=.5+((y-b.center.y-pan.y)/(b.height*zoom)).toDouble()\n     val kg=maxY-normalized*(maxY-minY);val baseline=y-(metrics.ascent+metrics.descent)/2f\n     drawContext.canvas.nativeCanvas.drawText(numberText(kg),b.left-gap,baseline,paint)\n    }\n    clipRect(b.left,b.top,b.right,b.bottom){\n     if(goalDay!=null&&goalWeight!=null&&points.isNotEmpty())drawLine(goalColor,project(first,points.first().kg,size),project(goalDay,goalWeight,size),2.dp.toPx())\n     trend?.let{f->drawLine(forecastColor,project(f.startDay,f.startKg,size),project(f.endDay,f.value(f.endDay),size),2.dp.toPx(),pathEffect=androidx.compose.ui.graphics.PathEffect.dashPathEffect(floatArrayOf(12f,8f)))}\n     points.zipWithNext().forEach{(a,bp)->drawLine(colors.primary,point(a,size),point(bp,size),2.dp.toPx())}\n     points.forEach{r->val p=point(r,size);drawCircle(colors.primary,5.dp.toPx(),p);drawCircle(colors.surface,2.dp.toPx(),p)}\n    }\n    val formatter=DateTimeFormatter.ofPattern("d MMM yy")\n    fun dateAt(x:Float):String{\n     val normalized=.5+((x-b.center.x-pan.x)/(b.width*zoom)).toDouble()\n     return LocalDate.ofEpochDay((minX+normalized*(maxX-minX)).toLong()).format(formatter)\n    }\n    val baseline=size.height-outer-metrics.descent\n    paint.textAlign=Paint.Align.LEFT;drawContext.canvas.nativeCanvas.drawText(dateAt(b.left),b.left,baseline,paint)\n    paint.textAlign=Paint.Align.RIGHT;drawContext.canvas.nativeCanvas.drawText(dateAt(b.right),b.right,baseline,paint)\n   }\n  }\n  if(goalDay!=null)Text("Green: goal",color=goalColor,style=MaterialTheme.typography.bodySmall)\n  if(trend!=null)Text("Orange dashed: estimated trend",color=forecastColor,style=MaterialTheme.typography.bodySmall)\n  else if(points.isNotEmpty())Text("Prediction needs 3 measurements spanning 7 days.",style=MaterialTheme.typography.bodySmall)\n }\n}\n'
          FORECAST='package com.example.caloriecounter\nimport java.time.LocalDate\n\ndata class AppWeightForecast(val startDay:Double,val startKg:Double,val kgPerDay:Double,val endDay:Double){\n fun value(day:Double)=startKg+kgPerDay*(day-startDay)\n}\nfun appWeightForecast(records:List<WeightRecord>,goalDate:String?=null):AppWeightForecast?{\n val sorted=records.filter{it.kg.isFinite()&&it.kg>0&&runCatching{LocalDate.parse(it.date)}.isSuccess}.sortedBy{it.date}.distinctBy{it.date}\n val last=sorted.lastOrNull()?:return null\n val lastDay=LocalDate.parse(last.date).toEpochDay()\n val recent=sorted.filter{LocalDate.parse(it.date).toEpochDay()>=lastDay-28}\n if(recent.size<3||lastDay-LocalDate.parse(recent.first().date).toEpochDay()<7)return null\n val xs=recent.map{(LocalDate.parse(it.date).toEpochDay()-lastDay).toDouble()}\n val meanX=xs.average();val meanKg=recent.map{it.kg}.average()\n val denominator=xs.sumOf{(it-meanX)*(it-meanX)}\n if(denominator<=0)return null\n val slope=recent.indices.sumOf{(xs[it]-meanX)*(recent[it].kg-meanKg)}/denominator\n val target=goalDate?.let{runCatching{LocalDate.parse(it).toEpochDay()}.getOrNull()}\n val requested=if(target!=null&&target>lastDay)(target-lastDay).coerceAtMost(90L).toDouble()else 90.0\n val boundary=when{slope<0->(last.kg-25.0)/(-slope);slope>0->(400.0-last.kg)/slope;else->90.0}\n val days=minOf(requested,boundary)\n if(!slope.isFinite()||days<=0)return null\n return AppWeightForecast(lastDay.toDouble(),last.kg,slope,lastDay.toDouble()+days)\n}\n'
          IMPORTS=['android.graphics.Paint', 'androidx.compose.foundation.Canvas', 'androidx.compose.foundation.gestures.detectTapGestures', 'androidx.compose.foundation.gestures.detectTransformGestures', 'androidx.compose.foundation.layout.*', 'androidx.compose.material3.*', 'androidx.compose.runtime.*', 'androidx.compose.ui.Modifier', 'androidx.compose.ui.geometry.Offset', 'androidx.compose.ui.geometry.Size', 'androidx.compose.ui.graphics.Color', 'androidx.compose.ui.graphics.drawscope.clipRect', 'androidx.compose.ui.graphics.nativeCanvas', 'androidx.compose.ui.graphics.toArgb', 'androidx.compose.ui.input.pointer.pointerInput', 'androidx.compose.ui.layout.onSizeChanged', 'androidx.compose.ui.unit.dp', 'androidx.compose.ui.unit.sp', 'java.time.LocalDate', 'java.time.format.DateTimeFormatter', 'kotlin.math.hypot']
          path=pkg/'WeightScreen.kt';original=path.read_text()
          print('Inspecting existing chart declarations, not assuming a particular forecast-call name.')
          updated,replaced=replace_weight_charts(original,CHART)
          match=re.search(r'^package\s+com\.example\.caloriecounter\s*$',updated,flags=re.M)
          if not match:raise SystemExit('Unexpected WeightScreen.kt package')
          existing_imports={line.strip() for line in updated.splitlines() if line.strip().startswith('import ')}
          missing=[name for name in IMPORTS if 'import '+name not in existing_imports]
          if missing:updated=updated[:match.end()]+chr(10)+chr(10).join('import '+name for name in missing)+chr(10)+updated[match.end():]
          path.write_text(updated,encoding='utf-8')
          existing=False
          for p in pkg.rglob('*.kt'):
              if p.name=='AppWeightForecast.kt':continue
              if re.search(r'\bfun\s+weightForecast\s*\(',p.read_text()):existing=True
              if re.search(r'\bfun\s+appWeightForecast\s*\(',p.read_text()):raise SystemExit('Another appWeightForecast definition exists in '+str(p))
          if not existing:FORECAST+=chr(10)+'fun weightForecast(records:List<WeightRecord>,goalDate:String?=null):AppWeightForecast?=appWeightForecast(records,goalDate)'+chr(10)
          (pkg/'AppWeightForecast.kt').write_text(FORECAST,encoding='utf-8')
          p=root/"app/src/test/java/com/example/caloriecounter/ForecastRepairTest.kt";p.parent.mkdir(parents=True,exist_ok=True);p.write_text('package com.example.caloriecounter\nimport org.junit.Assert.*\nimport org.junit.Test\nimport java.time.LocalDate\nclass ForecastRepairTest{\n private fun point(days:Int,kg:Double)=WeightRecord(date=LocalDate.of(2026,1,1).plusDays(days.toLong()).toString(),kg=kg)\n @Test fun helperHasGraphFields(){val f=appWeightForecast(listOf(point(0,80.0),point(7,79.3),point(14,78.6)),null)!!;assertEquals(78.6,f.startKg,0.00001);assertEquals(-0.1,f.kgPerDay,0.00001);assertTrue(f.endDay>f.startDay);assertEquals(77.9,f.value(f.startDay+7),0.00001)}\n @Test fun tooFewPoints(){assertNull(appWeightForecast(listOf(point(0,80.0),point(14,79.0)),null))}\n @Test fun tooShortSpan(){assertNull(appWeightForecast(listOf(point(0,80.0),point(1,79.9),point(2,79.8)),null))}\n @Test fun irregularSpacing(){val f=appWeightForecast(listOf(point(0,80.0),point(3,79.7),point(14,78.6)),null)!!;assertEquals(-0.1,f.kgPerDay,0.00001)}\n @Test fun gain(){assertTrue(appWeightForecast(listOf(point(0,70.0),point(7,70.7),point(14,71.4)),null)!!.kgPerDay>0)}\n @Test fun oldOrBadRecordsDoNotContaminateTrend(){val f=appWeightForecast(listOf(point(-100,150.0),WeightRecord(date="invalid",kg=70.0),point(0,80.0),point(7,79.3),point(14,78.6)),null)!!;assertEquals(-0.1,f.kgPerDay,0.00001)}\n}\n',encoding="utf-8")
          p=root/'app/build.gradle.kts';text=p.read_text();match=re.search(r'versionCode\s*=\s*(\d+)',text)
          version=max(18,int(match.group(1))+1) if match else 18
          text=re.sub(r'versionCode\s*=\s*\d+','versionCode = '+str(version),text);text=re.sub(r'versionName\s*=\s*"[^"]+"','versionName = "2.7.1"',text);p.write_text(text)
          assets_after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'app/src/main/assets').rglob('*') if p.is_file()}
          icons_after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'app/src/main/res').rglob('*') if p.is_file() and ('launcher' in p.name or p.name=='icon_colors.xml')}
          if assets_before!=assets_after or icons_before!=icons_after:raise SystemExit('Existing restaurant or icon assets changed unexpectedly')
          report={'version':'2.7.1','version_code':version,'chart_declarations_replaced':replaced,'repair':'Self-contained chart and typed forecast helper; supports both earlier 3-argument and newer 4-argument chart calls.','legacy_forecast_alias_added':not existing,'favourites_retained':True,'navigation_update_present':'GraphViewportRange' in (pkg/'Models.kt').read_text(),'preserved_assets':assets_after,'preserved_icons':icons_after}
          Path('forecast-repair-report.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          PY
      - name: Test and build APK
        run: gradle -p CalorieCounter testDebugUnitTest assembleDebug --console=plain
      - name: Package complete project after successful tests and build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('CalorieCounter')
          with zipfile.ZipFile('CalorieCounter-updated.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  rel = path.relative_to(root)
                  if path.is_file() and not any(part in {'build', '.gradle', '.git'} for part in rel.parts) and path.name != 'local.properties':
                      archive.write(path, path.as_posix())
          with zipfile.ZipFile('CalorieCounter-updated.zip') as archive:
              assert archive.testzip() is None
          PY
      - name: Upload repaired complete project
        uses: actions/upload-artifact@v4
        with:
          name: repaired-favourites-update-project
          path: |
            CalorieCounter-updated.zip
            forecast-repair-report.json
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calorie-counter-debug-apk
          path: CalorieCounter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repaired-update-test-reports
          path: CalorieCounter/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
